name: Build RiftLink Integrated V2.3 APK
on:
  push:
    branches: [riftlink-v22-preserved-integration]
    paths:
      - 'riftlink-android/**'
      - '.github/workflows/riftlink-v22-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: riftlink-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build native V2.2-based APK
        run: |
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLink-Integrated-V23-APK
          path: riftlink-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
