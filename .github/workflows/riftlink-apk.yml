name: Build RiftLink Android Game Mode
on:
  push:
    branches: [riftlink-android-gamemode-build]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract RiftLink Android project
        run: |
          mkdir -p AndroidApp
          base64 --decode riftlink_build_source.b64 | tar -xz -C AndroidApp
          test -f AndroidApp/app/src/main/AndroidManifest.xml
      - name: Repair Android Keystore pairing encryption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("AndroidApp")
          p = root / "app/src/main/java/app/riftlink/mobile/RiftClient.java"
          text = p.read_text()
          before = 'byte[] iv=new byte[12];new SecureRandom().nextBytes(iv);Cipher cipher=Cipher.getInstance("AES/GCM/NoPadding");cipher.init(Cipher.ENCRYPT_MODE,getKey(),new GCMParameterSpec(128,iv));'
          after = 'Cipher cipher=Cipher.getInstance("AES/GCM/NoPadding");cipher.init(Cipher.ENCRYPT_MODE,getKey());byte[] iv=cipher.getIV();if(iv==null||iv.length!=12)throw new GeneralSecurityException("Unexpected Android Keystore GCM IV");'
          assert text.count(before) == 1, "Encryption source changed: abort instead of building unpatched APK"
          patched = text.replace(before, after)
          assert "cipher.init(Cipher.ENCRYPT_MODE,getKey(),new GCMParameterSpec" not in patched, "Caller-provided IV remains"
          assert patched.count("cipher.getIV()") == 1
          p.write_text(patched)
          gradle = root / "app/build.gradle"
          config = gradle.read_text()
          assert "versionCode 3" in config
          gradle.write_text(config.replace("versionCode 3", "versionCode 4").replace("versionName '3.3.0'", "versionName '3.4.1'"))
          print("VERIFIED: Keystore generates unique encryption IV; existing decrypt/record format preserved.")
          PY
      - name: Build and validate debug APK
        run: |
          gradle --no-daemon -p AndroidApp assembleDebug
          test -s AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          unzip -t AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          cp AndroidApp/app/build/outputs/apk/debug/app-debug.apk RiftLink_AutoPair_GCM_Fix_Android.apk
          sha256sum RiftLink_AutoPair_GCM_Fix_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLink_AutoPair_GCM_Fix_Android_APK
          path: RiftLink_GameMode_Android.apk
          retention-days: 7
      - name: Record successful build run for artifact retrieval
        if: success()
        run: |
          mkdir -p builds
          printf '%s\n' "$GITHUB_RUN_ID" > builds/riftlink_latest_android_run.txt
          printf '%s\n' "$GITHUB_SHA" > builds/riftlink_latest_android_commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/riftlink_latest_android_run.txt builds/riftlink_latest_android_commit.txt
          git commit -m "Record RiftLink Android GCM repair build [skip ci]"
          git push origin HEAD:riftlink-android-gamemode-build
