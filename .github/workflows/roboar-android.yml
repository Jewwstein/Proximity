name: RoboAR test APK
on:
  push:
    branches: [roboar-android-prototype]
    paths:
      - 'roboar/**'
      - '.github/workflows/roboar-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build Android debug APK
        working-directory: roboar
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoboAR-v0.1-debug-APK
          path: roboar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create roboar-v0.1 roboar/app/build/outputs/apk/debug/app-debug.apk#RoboAR-v0.1-debug.apk --target "$GITHUB_SHA" --title "RoboAR v0.1 AR prototype" --notes "Experimental Android ARCore build. Real car recognition and removal are NOT implemented. Install this debug APK on an ARCore-supported Android phone." --prerelease || gh release upload roboar-v0.1 roboar/app/build/outputs/apk/debug/app-debug.apk#RoboAR-v0.1-debug.apk --clobber
