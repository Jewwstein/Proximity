name: EchoSight Android Test APK
on:
  push:
    branches: [echo-sight-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android test APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoSight-v0.3.1-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EchoSight-v0.3.1.apk
          gh release create echo-sight-v0.3.1 EchoSight-v0.3.1.apk --target "$GITHUB_SHA" --title "EchoSight v0.3.1 experimental sonar + camera vision" --notes "Experimental ARCore spatial memory: scan in light, save real tracked points and optional depth, view glowing saved 3D geometry in darkness using phone rotation. DARK MODE FREEZES POSITION and cannot track walking; DO NOT USE FOR NAVIGATION. Device ARCore support and on-phone scan unverified." --prerelease || gh release upload echo-sight-v0.3.1 EchoSight-v0.3.1.apk --clobber
