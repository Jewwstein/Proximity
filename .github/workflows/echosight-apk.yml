name: EchoSight Android Test APK
on:
  push:
    branches: [echo-sight-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android test APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoSight-v0.4.0-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EchoSight-v0.4.0.apk
          gh release create echo-sight-v0.4.0 EchoSight-v0.4.0.apk --target "$GITHUB_SHA" --title "EchoSight v0.4.0 experimental sonar + camera vision" --notes "v0.4: wider letterboxed ARCore camera for tall-phone aspect ratio, 145k mapped samples, measured depth surface edges and ARCore plane outlines, 3D depth-line rendering and top-down view. Optional STEP DETECTOR + phone heading dead reckoning, adjustable stride, uncertainty warning, 24-step cap. Requires ACTIVITY_RECOGNITION permission for steps. No safe navigation in darkness; ARCore compatibility and phone behavior not physically verified." --prerelease || gh release upload echo-sight-v0.4.0 EchoSight-v0.4.0.apk --clobber
