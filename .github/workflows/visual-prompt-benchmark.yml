name: Validate image-guided YOLOE recognition
on:
  push:
    branches: [plain-sight-android]
    paths:
      - benchmarks/yoloe_visual_prompt.py
      - .github/workflows/visual-prompt-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU vision system
        run: |
          python -m pip install --upgrade pip
          pip install 'ultralytics>=8.4.0' pillow numpy
      - name: Test true image-example model on positive and negative scenes
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python benchmarks/yoloe_visual_prompt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YOLOE-Visual-Prompt-Validation
          path: benchmarks/reports/
