name: Compare real image-guided detection engines
on:
  push:
    branches: [plain-sight-android]
    paths:
      - benchmarks/yoloe_visual_prompt.py
      - benchmarks/yoloe_real_fob.py
      - benchmarks/owlv2_image_guided.py
      - .github/workflows/visual-prompt-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU vision system
        run: |
          python -m pip install --upgrade pip
          pip install 'ultralytics>=8.4.0' pillow numpy
      - name: Test YOLOE real key fob against clutter (record failures)
        continue-on-error: true
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python benchmarks/yoloe_real_fob.py
      - name: Install OWLv2 model support
        run: pip install 'transformers>=4.57,<5' safetensors scipy
      - name: Test OWLv2 image-guided detection with same fob and negatives
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_DISABLE_XET: '1'
        run: python benchmarks/owlv2_image_guided.py
      - name: Test true image-example model on positive and negative scenes
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python benchmarks/yoloe_visual_prompt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Image-Guided-Model-Comparison
          path: benchmarks/reports/
