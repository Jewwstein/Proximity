name: Verify DINOv2 offline model
on:
  push:
    branches: [plain-sight-android]
    paths: [verify_dino.py, .github/workflows/verify-dino.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download quantized small DINOv2
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 'https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model_quantized.onnx' -o app/src/main/assets/dinov2-small.onnx
          ls -lh app/src/main/assets/dinov2-small.onnx
          test "$(stat -c%s app/src/main/assets/dinov2-small.onnx)" -gt 10000000
      - name: Run CPU ONNX inference and compare examples
        run: |
          pip install -q 'onnxruntime==1.23.2' pillow numpy
          python verify_dino.py
      - uses: actions/upload-artifact@v4
        with:
          name: PlainSight-DINOv2-small
          path: app/src/main/assets/dinov2-small.onnx
          if-no-files-found: error
