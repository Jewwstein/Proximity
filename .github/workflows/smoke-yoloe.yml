name: Plain Sight straw recognition smoke test
on:
  push:
    branches: [plain-sight-android]
    paths: [smoke_yoloe.py, .github/workflows/smoke-yoloe.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact exported model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          ID=$(gh run list --workflow 'Export YOLOE offline visual model' --status success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$ID" -n PlainSight-YOLOE-offline-model -D out
      - name: Install inference test runtime
        run: pip install -q onnxruntime==1.23.2 pillow numpy
      - name: Detect real photographed straw
        run: python smoke_yoloe.py
