name: Plain Sight - Android APK
on:
  push:
    branches: [plain-sight-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainSight-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Name final test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PlainSight-v0.2.1.apk
      - name: Publish test APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create plain-sight-v0.2.1 app/build/outputs/apk/debug/PlainSight-v0.2.1.apk --target "$GITHUB_SHA" --title "Plain Sight v0.2.1 · personal object learning" --notes "Standalone Android visual object finder test build. First search downloads a quantized open-vocabulary detector (~160 MB). Requires Chrome WebView internet access. Not yet device-validated." --prerelease || gh release upload plain-sight-v0.2.1 app/build/outputs/apk/debug/PlainSight-v0.2.1.apk --clobber
