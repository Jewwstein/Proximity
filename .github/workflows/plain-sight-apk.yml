name: Plain Sight Android APK
on:
  push:
    branches: [plain-sight-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch exported offline YOLOE model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          RUN_ID=$(gh run list --workflow 'Export YOLOE offline visual model' --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then echo "No successful YOLOE model export found"; exit 1; fi
          gh run download "$RUN_ID" -n PlainSight-YOLOE-offline-model -D app/src/main/assets
          test -s app/src/main/assets/plainsight-yoloe.onnx
          test -s app/src/main/assets/categories.json
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainSight-Offline-v0.5.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PlainSight-v0.5.2.apk
          gh release create plain-sight-v0.5.2 PlainSight-v0.5.2.apk --target "$GITHUB_SHA" --title "Plain Sight v0.5.2 — Offline visual search" --notes "On-device YOLOE model for 62 object categories, plus bundled offline text recognition. No Gemini image uploads or API key. Experimental and not yet tested on the target phone." --prerelease || gh release upload plain-sight-v0.5.2 PlainSight-v0.5.2.apk --clobber
