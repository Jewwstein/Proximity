name: Plain Sight Android APK
on:
  push:
    branches: [plain-sight-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle personal recognition model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --connect-timeout 20 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite' -o app/src/main/assets/mobilenet_v3_small.tflite
          test "$(stat -c%s app/src/main/assets/mobilenet_v3_small.tflite)" -gt 100000
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PlainSight-Native-v0.3.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PlainSight-v0.3.1.apk
          gh release create plain-sight-v0.3.1 PlainSight-v0.3.1.apk --target "$GITHUB_SHA" --title "Plain Sight v0.3.1 - Native camera repair" --notes "Native Android camera preview remains live during scanning. Personal item recognition model embedded offline. Experimental, needs real phone validation." --prerelease || gh release upload plain-sight-v0.3.1 PlainSight-v0.3.1.apk --clobber
