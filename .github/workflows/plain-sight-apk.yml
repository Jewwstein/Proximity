name: Plain Sight Android APK
on:
  push:
    branches: [plain-sight-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainSight-Gemini-v0.4.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PlainSight-v0.4.1.apk
          gh release create plain-sight-v0.4.1 PlainSight-v0.4.1.apk --target "$GITHUB_SHA" --title "Plain Sight v0.4.1 — Gemini AI visual search" --notes "Real open-vocabulary object grounding with Gemini 3.8 Flash API, saved reference photos, and bounding-box highlights. Requires user's own Gemini API key entered in app. Camera images sent to Google's Gemini API. Not device-validated; experimental." --prerelease || gh release upload plain-sight-v0.4.1 PlainSight-v0.4.1.apk --clobber
