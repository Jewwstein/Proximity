name: Export YOLOE offline visual model
on:
  push:
    branches: [plain-sight-android]
    paths:
      - offline_yoloe_export.py
      - .github/workflows/export-yoloe.yml
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU machine learning tools
        run: |
          python -m pip install --upgrade pip
          pip install 'ultralytics>=8.4.0' onnx
      - name: Export phone model
        run: python offline_yoloe_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: PlainSight-YOLOE-offline-model
          path: out/
          if-no-files-found: error
