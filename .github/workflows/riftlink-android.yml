name: Build RiftLink Android APK
on:
  push:
    branches: [riftlink-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: riftlink-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install platform for Android API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Save installable RiftLink APK
        uses: actions/upload-artifact@v4
        with:
          name: RiftLink-Android-APK
          path: riftlink-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
