name: Build RiftLink AutoPair APK
on:
  push:
    branches: [ "riftlink-android-gamemode-build" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore RiftLink project
        run: |
          base64 -d riftlink_build_source.b64 | tar xzf - -C .
          test -f app/src/main/java/app/riftlink/mobile/PcDiscovery.java
          test -f app/src/main/java/app/riftlink/mobile/DesktopGestures.java
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RiftLink-AutoPair-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
