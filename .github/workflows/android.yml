name: Build Soul Slime Unity APK
on:
  push:
    branches: [ "soulslime-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Unity project
        shell: bash
        run: |
          mkdir -p SoulSlimeUnity
          cat .soulslime_unity_payload/part-* | base64 -d > /tmp/SoulSlimeUnityPayload.zip
          unzip -q /tmp/SoulSlimeUnityPayload.zip -d SoulSlimeUnity
      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: SoulSlimeUnity/SoulSlime-Unity-Migration-v15
          unityVersion: 6000.0.62f1
          targetPlatform: Android
          androidExportType: androidPackage
          customParameters: -executeMethod SoulSlimeProjectSetup.BuildAndroid
      - name: Collect APK
        shell: bash
        run: |
          find SoulSlimeUnity -type f -name "*.apk" -print
          mkdir -p deliverable
          APK="$(find SoulSlimeUnity -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" deliverable/SoulSlime-Unity6-AssetBundles-v16.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoulSlime-Unity6-AssetBundles-v16
          path: deliverable/SoulSlime-Unity6-AssetBundles-v16.apk
