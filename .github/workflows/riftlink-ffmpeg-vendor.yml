name: Package RiftLink LGPL GPU Encoder
on:
  push:
    branches: [riftlink-apk-build]
    paths: [.github/workflows/riftlink-ffmpeg-vendor.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffmpeg:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Fetch pinned LGPL FFmpeg binary from BtbN release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          $expected = 'cff5decec7ec25570e3699062a6fbcb02be7abb0feebd4c67654bb9fd55352fa'
          if ($actual -ne $expected) { throw "FFmpeg release checksum mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath extracted
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = Get-ChildItem extracted -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe absent' }
          Copy-Item $exe.FullName release/ffmpeg.exe
          & release/ffmpeg.exe -hide_banner -encoders | Select-String 'h264_nvenc|h264_amf|h264_qsv|libx264' | ForEach-Object { Write-Host $_ }
          Get-ChildItem extracted -Recurse -File -Include 'LICENSE','LICENSE.txt','COPYING*','README.txt' |
            Select-Object -First 10 | ForEach-Object { Copy-Item $_.FullName ('release/' + $_.Name) -Force }
          Get-FileHash release/ffmpeg.exe -Algorithm SHA256 | Format-List
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftLink-FFmpeg-LGPL-GPU
          path: release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
