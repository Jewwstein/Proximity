<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090c15">
<title>Plain Sight</title>
<style>
:root { font-family:system-ui,-apple-system,Roboto,Arial,sans-serif; color:#fff; background:#090c15 }
* { box-sizing:border-box }
html, body { margin:0; width:100%; height:100%; overflow:hidden }
#stage { position:absolute; inset:0; overflow:hidden; transform-origin:top left; transition:transform .6s cubic-bezier(.2,.8,.2,1) }
#camera,#photo { position:absolute; width:100%; height:100%; inset:0; object-fit:cover; }
#photo { display:none }
#shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(4,8,18,.63),transparent 25%,transparent 66%,rgba(4,8,18,.78)); pointer-events:none }
#overlay { position:absolute; inset:0; pointer-events:none }
#box { position:absolute; display:none; border:3px solid #a2f3ff; box-shadow:0 0 0 9999px rgba(3,11,20,.25),0 0 25px #26c9ff, inset 0 0 24px #26c9ff55; border-radius:15px; }
#box::before, #box::after { content:''; position:absolute; width:17px; height:17px; border-color:#fff; border-style:solid }
#box::before { left:-5px; top:-5px; border-width:4px 0 0 4px; border-radius:5px 0 0 0 }
#box::after { right:-5px; bottom:-5px; border-width:0 4px 4px 0; border-radius:0 0 5px 0 }
#top { position:absolute; top:max(18px,env(safe-area-inset-top)); left:20px; right:20px; z-index:2 }
.brand { font-size:20px; font-weight:850; letter-spacing:.8px }
.brand span { color:#7fe8ff }
#status { font-size:12px; margin-top:5px; color:#d4d9e5; text-shadow:0 2px 6px #000; max-width:90%; overflow-wrap:anywhere; }
#status.error { color:#ffb2a7 }
#bottom { position:absolute; bottom:max(28px,env(safe-area-inset-bottom)); left:12px; right:12px; z-index:3; padding:8px; border:1px solid #ffffff37; border-radius:23px; background:#0d1624da; backdrop-filter:blur(20px); display:flex; align-items:center; gap:7px; }
input { background:transparent; color:#fff; outline:none; border:0; font-size:16px; width:100%; min-width:0; padding:12px 6px; }
input::placeholder { color:#aab8c9 }
button { color:#081120; cursor:pointer; border:0; font-size:15px; font-weight:800; min-width:49px; height:48px; border-radius:16px; background:#84e8ff }
#mic { background:#203247; color:white; font-size:23px }
#find { padding:0 16px }
#found { display:none; position:absolute; z-index:3; top:90px; left:18px; right:18px; text-align:center; border-radius:14px; border:1px solid #a2f3ff80; padding:12px; font-weight:700; background:#071825d9; }
#tip { position:absolute; z-index:2; bottom:104px; text-align:center; width:100%; font-size:13px; color:#dfe6f3; text-shadow:0 1px 6px #000; pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
  <video id="camera" playsinline autoplay muted></video>
  <img id="photo" alt="Captured frame">
  <div id="overlay"><div id="box"></div></div>
</div>
<div id="shade"></div>
<div id="top"><div class="brand">PLAIN <span>SIGHT</span></div><div id="status">Starting camera…</div></div>
<div id="found"></div>
<div id="tip">Point at a room, pile or drawer.</div>
<div id="bottom">
<input id="query" placeholder="Find my keys…" maxlength="120" enterkeyhint="search" aria-label="Thing to find">
<button id="mic" aria-label="Voice search">🎙</button>
<button id="find">FIND</button>
</div>
<canvas id="capture" style="display:none"></canvas>
<script>
const camera=document.getElementById('camera'), photo=document.getElementById('photo'),
 query=document.getElementById('query'), status=document.getElementById('status'),
 box=document.getElementById('box'), stage=document.getElementById('stage'),
 found=document.getElementById('found'), tip=document.getElementById('tip'),
 btn=document.getElementById('find'), canvas=document.getElementById('capture');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let detector=null, moduleLib=null, loading=null, busy=false, active=false, current='', cameraReady=false, run=0, stream=null;
function setStatus(message,error=false) { status.textContent=message; status.classList.toggle('error',error); }
window.cameraPermissionDenied=()=>setStatus('Camera permission is required. Enable it in Android settings.',true);
window.speechUnavailable=()=>setStatus('Voice recognition unavailable; please type your search.',true);
window.onSpeech=(words)=>{ query.value=words; begin(); };
async function startCamera(){
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Camera API unavailable');
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  camera.srcObject=stream; await camera.play(); cameraReady=true;
  setStatus('Ready · search for anything visible');
 }catch(e){ setStatus('Camera unavailable: '+String(e.message||e),true); }
}
function labelsFor(text){
 const cleaned=text.toLowerCase().replace(/^(please\s+)?(can you\s+)?(find|locate|spot|where is|where are|show me|look for)\s+/i,'').replace(/^(my|the|a|an)\s+/,'').replace(/[?.!]+$/,'').trim();
 if(!cleaned) return [];
 let labels=[cleaned];
 if(/\bkeys?\b/.test(cleaned)) labels.push('car keys','keyring','a set of metal keys');
 else if(/\bremote\b/.test(cleaned)) labels.push('television remote control');
 else if(/\bglasses\b/.test(cleaned)) labels.push('eyeglasses');
 else if(/\bshirt\b/.test(cleaned)) labels.push('t-shirt');
 else if(/\bketchup\b/.test(cleaned)) labels.push('ketchup bottle');
 return [...new Set(labels)].slice(0,5);
}
async function ensureModel(){
 if(detector) return detector;
 if(loading) return loading;
 loading=(async()=>{
  setStatus('Loading visual search · first run downloads about 160 MB of AI data…');
  moduleLib=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
  moduleLib.env.allowLocalModels=false;
  moduleLib.env.useBrowserCache=true;
  if(moduleLib.env.backends?.onnx?.wasm) moduleLib.env.backends.onnx.wasm.numThreads=1;
  detector=await moduleLib.pipeline('zero-shot-object-detection','onnx-community/owlvit-base-patch32-ONNX',{
   device:'wasm',dtype:'q8',
   progress_callback:(p)=>{
    if(p && p.status==='progress' && Number.isFinite(p.progress))
      setStatus('Preparing AI · '+Math.round(p.progress)+'% of '+(p.file||'model'));
   }
  });
  setStatus('AI ready · scanning');
  return detector;
 })();
 try{return await loading} catch(e){ loading=null; throw e }
}
function displayBox(detection,w,h){
 const b=detection.box||{};
 const x1=Number(b.xmin??b.x_min??0),y1=Number(b.ymin??b.y_min??0);
 const x2=Number(b.xmax??b.x_max??w),y2=Number(b.ymax??b.y_max??h);
 const W=window.innerWidth,H=window.innerHeight,scale=Math.max(W/w,H/h);
 const left=(W-w*scale)/2+x1*scale,top=(H-h*scale)/2+y1*scale;
 const width=(x2-x1)*scale,height=(y2-y1)*scale;
 box.style.cssText='display:block;left:'+left+'px;top:'+top+'px;width:'+width+'px;height:'+height+'px';
 const centerX=left+width/2,centerY=top+height/2;
 const factor=Math.min(2.5,Math.max(1.2,Math.min(W/Math.max(75,width),H/Math.max(75,height))*.53));
 const dx=W/2-centerX*factor,dy=H/2-centerY*factor;
 stage.style.transform='translate('+dx+'px,'+dy+'px) scale('+factor+')';
 const percentage=Math.round((detection.score||0)*100);
 found.style.display='block'; found.textContent='FOUND: '+current+' · '+percentage+'% match';
 tip.textContent='Digital zoom · tap FIND to scan again';
 btn.textContent='AGAIN';
}
function clearHit(){
 stage.style.transform='none'; box.style.display='none'; photo.style.display='none';
 found.style.display='none'; btn.textContent='FIND';
}
window.resetSearch=()=>{ active=false; run++; busy=false; clearHit(); setStatus('Ready · search for anything visible'); };
async function scanOnce(id){
 if(!active||busy||!cameraReady||!camera.videoWidth)return;
 busy=true;
 try {
  const vW=camera.videoWidth,vH=camera.videoHeight;
  const downscale=Math.min(1,800/Math.max(vW,vH));
  canvas.width=Math.round(vW*downscale);canvas.height=Math.round(vH*downscale);
  ctx.drawImage(camera,0,0,canvas.width,canvas.height);
  photo.src=canvas.toDataURL('image/jpeg',.92); photo.style.display='block';
  setStatus('Searching for '+current+'…');
  const model=await ensureModel();
  if(id!==run)return;
  const image=moduleLib.RawImage.fromCanvas(canvas);
  const labels=labelsFor(current);
  let detections=await model(image,labels,{top_k:8,threshold:0.055});
  if(id!==run)return;
  detections=(detections||[]).filter(d=>d?.box && d.score>0.055).sort((a,b)=>b.score-a.score);
  if(detections.length){
   active=false;displayBox(detections[0],canvas.width,canvas.height);
   setStatus('Best visual match highlighted. Tap AGAIN to search again.');
  } else {
   photo.style.display='none'; setStatus('Not spotted. Move slowly and keep the object in view.');
   tip.textContent='Keep scanning · looking for '+current;
  }
 } catch(e) {
  photo.style.display='none'; active=false;
  setStatus('Search engine error: '+String(e.message||e).slice(0,160),true);
 } finally {
  busy=false;
  if(active&&id===run) setTimeout(()=>scanOnce(id),900);
 }
}
function begin(){
 const value=query.value.trim();
 if(!value){ query.focus();return }
 current=value;run++;active=true;clearHit();query.blur();tip.textContent='Searching · point camera toward objects';
 scanOnce(run);
}
document.getElementById('find').addEventListener('click',begin);
document.getElementById('mic').addEventListener('click',()=>{
 if(window.PlainSightAndroid?.speak){window.PlainSightAndroid.speak();}
 else {query.focus();setStatus('Type the item you want to find.');}
});
query.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();begin()}});
window.addEventListener('resize',()=>{if(found.style.display==='block'){clearHit();setStatus('Tap FIND to search again')}});
startCamera();
</script>
<script src="personal.js"></script>
</body>
</html>
