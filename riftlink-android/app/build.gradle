plugins { id 'com.android.application' }
android {
    namespace 'app.riftlink.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'app.riftlink.mobile.integrated'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '2.3.0-integrated-test'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
