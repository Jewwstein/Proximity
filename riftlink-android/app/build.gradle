plugins { id 'com.android.application' }
android {
    namespace 'app.riftlink.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'app.riftlink.mobile.integrated.v24'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '2.4.0-integrated-test'
