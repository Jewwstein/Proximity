plugins { id 'com.android.application' }
android {
    namespace 'app.riftlink.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'app.riftlink.mobile.integrated.v25'
        minSdk 29
        targetSdk 35
        versionCode 15
        versionName '2.5.0-scroll-cellular-test'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
